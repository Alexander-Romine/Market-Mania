<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071012" />
      <stop offset="100%" stop-color="#122325" />
    </linearGradient>
    <radialGradient id="goldCoin" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8bd" />
      <stop offset="35%" stop-color="#f4c430" />
      <stop offset="75%" stop-color="#c4900a" />
      <stop offset="100%" stop-color="#694b00" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#23423d" stroke-width="2" />
  
  <!-- Subtle market grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1d3032" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
  <line x1="8" y1="46" x2="56" y2="46" stroke="#1d3032" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Candlestick chart bars -->
  <!-- Bar 1 (Dip) -->
  <line x1="16" y1="36" x2="16" y2="52" stroke="#ff5d6a" stroke-width="1.2" opacity="0.6" />
  <rect x="13.5" y="40" width="5" height="8" rx="1" fill="#ff5d6a" opacity="0.75" />

  <!-- Bar 2 (Rise) -->
  <line x1="26" y1="28" x2="26" y2="48" stroke="#2ee6b8" stroke-width="1.2" opacity="0.6" />
  <rect x="23.5" y="32" width="5" height="12" rx="1" fill="#2ee6b8" opacity="0.8" />

  <!-- Bar 3 (Surge) -->
  <line x1="36" y1="20" x2="36" y2="44" stroke="#2ee6b8" stroke-width="1.2" opacity="0.7" />
  <rect x="33.5" y="24" width="5" height="14" rx="1" fill="#2ee6b8" />

  <!-- Bullish Trendline with Glow -->
  <polyline
    points="11,47 21,37 29,41 46,18"
    fill="none"
    stroke="#2ee6b8"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrowhead pointing up-right -->
  <path d="M37 17.5 L46.5 17.5 L46.5 27" fill="none" stroke="#2ee6b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Coin / Star Sparkle at Peak -->
  <circle cx="48" cy="18" r="9.5" fill="url(#goldCoin)" stroke="#fef08a" stroke-width="1.2" />
  <!-- Star symbol inside coin -->
  <path d="M48 12.5 L49.6 15.8 L53.2 16.2 L50.5 18.6 L51.2 22.2 L48 20.3 L44.8 22.2 L45.5 18.6 L42.8 16.2 L46.4 15.8 Z" fill="#ffffff" />
</svg>
